services:
  - type: web
    name: axiom
    runtime: python
    region: oregon
    plan: starter
    buildCommand: >-
      pip install -r axiom/requirements.txt &&
      cd axiom && npm install &&
      python -c "import solcx; solcx.install_solc('0.8.20'); print('[build] solc 0.8.20 ready')"
    startCommand: cd axiom && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SOMNIA_PRIVATE_KEY
        sync: false
      - key: SOMNIA_RPC_URL
        value: https://api.infra.testnet.somnia.network
      - key: SOMNIA_CHAIN_ID
        value: "50312"
      - key: PROVENANCE_REGISTRY_ADDRESS
        sync: false
      - key: COMPLIANCE_LOG_ADDRESS
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TRANSFORMERS_CACHE
        value: /opt/render/project/.cache/huggingface
